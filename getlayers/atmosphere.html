<!doctype html>
<html lang="ru">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Градиент Soffit 002</title>
<style>
  html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; background: #0a1015; }
  .light {
    position: absolute;
    inset: -16%;
    background: url("./soffit-002.webp") 45% 60% / cover no-repeat;
    filter: saturate(.58);
    opacity: .44;
    transform: rotate(-11deg) scale(1.04);
    animation: approach 1.5s cubic-bezier(.17, .7, .25, 1) both;
  }
  .shade {
    position: absolute;
    inset: 0;
    background: linear-gradient(85deg, #0a1015 0%, #0a1015 18%, transparent 75%), linear-gradient(0deg, #0a1015 0%, transparent 90%);
  }
  @keyframes approach {
    from { transform: translateX(4%) rotate(-9deg) scale(1.12); opacity: .12; }
    to { transform: rotate(-11deg) scale(1.04); opacity: .44; }
  }
  @media (prefers-reduced-motion: reduce) { .light { animation: none; } }
</style>
<div class="light" aria-hidden="true"></div>
<div class="shade" aria-hidden="true"></div>
</html>
